<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HugShop Thailand — พิกัดสินค้า</title><meta name="robots" content="noindex">
<style>
:root{--bg:#fff7f3;--card:#fff;--ink:#222;--mut:#888;--ac:#ee4d2d}
@media(prefers-color-scheme:dark){:root{--bg:#17161a;--card:#232129;--ink:#eee;--mut:#999}}
*{box-sizing:border-box}body{margin:0;font:16px/1.4 system-ui,Tahoma,sans-serif;background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;background:var(--bg);padding:16px 16px 10px;z-index:1}
h1{font-size:20px;margin:0 0 4px}p{margin:0 0 10px;color:var(--mut);font-size:14px}
input{width:100%;font:inherit;padding:12px 14px;border-radius:12px;border:1px solid #ccc;background:var(--card);color:var(--ink)}
main{padding:0 16px 32px;display:grid;gap:10px;max-width:640px;margin:auto}
.it{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:10px;text-decoration:none;color:inherit;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.no{min-width:46px;height:46px;border-radius:12px;background:var(--ac);color:#fff;font-weight:700;font-size:20px;display:grid;place-items:center}
img,.ph{width:56px;height:56px;border-radius:10px;object-fit:cover;flex:none;display:grid;place-items:center;background:#eee}
.nm{flex:1;font-size:15px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.go{color:var(--ac);font-weight:600;white-space:nowrap}
</style></head><body>
<header><h1>HugShop Thailand — พิกัดสินค้า</h1><p>ดูเบอร์จากคลิป แล้วกดสินค้าเบอร์นั้นได้เลย</p><input id="q" type="search" inputmode="numeric" placeholder="พิมพ์เบอร์ เช่น 12 หรือชื่อสินค้า"></header>
<main id="list">
<a class="it" href="https://s.shopee.co.th/30pINoqVCf" target="_blank" rel="noopener" data-q="1 ชุดถังปั่นไม้ม็อบ">
  <span class="no">1</span><span class="ph">🛒</span>
  <span class="nm">ชุดถังปั่นไม้ม็อบ</span><span class="go">ซื้อ ›</span></a>
</main>
<script>
const q=document.getElementById('q'),its=[...document.querySelectorAll('.it')];
q.oninput=()=>{const v=q.value.trim().toLowerCase();its.forEach(a=>{const no=a.querySelector('.no').textContent;a.hidden=!!v&&!(/^\d+$/.test(v)?no===v:a.dataset.q.includes(v));});};
// พิมพ์เบอร์แล้วกด Enter/ไป = เปิดสินค้าเบอร์นั้นเลย
q.onkeydown=(e)=>{if(e.key==='Enter'){const a=its.find(x=>!x.hidden);if(a)location.href=a.href;}};
// ลิงก์ตรงไปสินค้า: …/hugshop-links/?n=12 หรือ …/#12 → เด้งไปหน้าสินค้าเบอร์ 12 ทันที
const want=(new URLSearchParams(location.search).get('n')||location.hash.replace('#','')).trim();
if(/^\d+$/.test(want)){const a=its.find(x=>x.querySelector('.no').textContent===want);if(a){location.replace(a.href);}else{q.value=want;q.oninput();}}
</script></body></html>
